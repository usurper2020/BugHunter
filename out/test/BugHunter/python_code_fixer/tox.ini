[tox]
envlist = py37, py38, py39, py310, py311
isolated_build = True

[testenv]
deps =
    -r requirements-dev.txt
commands =
    pytest {posargs:tests}
    mypy python_fixer
    flake8 python_fixer tests

[testenv:lint]
deps =
    flake8
    black
commands =
    black --check python_fixer tests
    flake8 python_fixer tests

[testenv:type]
deps =
    mypy
commands =
    mypy python_fixer